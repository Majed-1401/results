<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحليل نتائج مادة لصف واحد | أ. ماجد الحربي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14262b;--mute:#5b6f75;--line:#d5e0e3;--pri:#0f4c5c;--acc:#c8963e;--bad:#b84a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#15262a;--ink:#e8f1f3;--mute:#9bb0b6;--line:#2a4046;--pri:#5fb4c7;--acc:#e0b05c}}
:root[data-theme="dark"]{--bg:#0e1a1d;--card:#15262a;--ink:#e8f1f3;--mute:#9bb0b6;--line:#2a4046;--pri:#5fb4c7;--acc:#e0b05c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.6}
header.top{background:#0f4c5c;color:#fff;padding:18px 16px}
header.top h1{margin:0;font-size:1.35rem;font-weight:800}
header.top p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.wrap{max-width:1180px;margin:auto;padding:14px;display:grid;gap:16px;grid-template-columns:minmax(0,370px) minmax(0,1fr)}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:1rem;color:var(--pri)}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}.chk input{width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--pri)}
#err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1.2em}
.scroll{overflow-x:auto}
#paper{--g:#2f9e78;--gl:#8fd0b6;background:#fff;color:#1f2d33;border:1px solid var(--line);border-radius:6px;padding:22px 26px;min-width:640px;max-width:820px;margin:auto;font-size:.9rem}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;font-size:.8rem;line-height:1.7}
.hd .ex{border:1px solid #b9c2c8;border-radius:8px;padding:14px 8px}
.hd img{height:72px;max-width:150px;object-fit:contain}
.lgph{width:120px;height:64px;border:1px dashed #b9c2c8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8a9aa0;font-size:.75rem}
.tw{position:relative;margin:16px 0}
.tw:before{content:"";position:absolute;top:50%;left:0;right:0;border-top:3px double #c5ccd1}
.ttl{position:relative;width:76%;margin:auto;background:#fff;border:1px solid var(--gl);border-radius:8px;text-align:center;padding:6px;font-weight:500}
.fbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 14px;padding-bottom:16px;border-bottom:1px solid #d9dfe3}
.fb{position:relative;border:1.5px solid #86c5d4;border-radius:8px;padding:12px 8px 8px;text-align:center}
.fb span{position:absolute;top:-12px;right:12px;background:#fff;padding:0 6px;color:var(--g);font-weight:700;font-size:.85rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lb{border:1.5px solid var(--gl);border-radius:6px;color:var(--g);text-align:center;padding:6px;font-weight:700}
.vl{border:1px solid #cfd6dc;border-radius:6px;text-align:center;padding:6px}
.dh{color:var(--g);font-weight:700;text-align:center;margin-bottom:4px}
.dr{display:grid;grid-template-columns:1.2fr 1.1fr .9fr;gap:8px;margin-bottom:8px}
.dr.h{color:var(--mute);text-align:center;font-size:.85rem}
.pl{color:#fff;font-weight:700;text-align:center;border-radius:6px;padding:6px}
.cb{border:1.5px solid var(--gl);border-radius:8px;padding:8px 14px 14px;margin-top:14px}
.ct{display:flex;align-items:center;gap:8px;color:var(--g);font-weight:700;font-size:.85rem;margin:6px 0 10px}
.ct:before,.ct:after{content:"";flex:1;border-top:2px dotted #c9d3d8}
.dns,.bs{display:flex;justify-content:space-around}
.dnt{position:relative;width:96px;height:96px}.dnt svg{width:100%;height:100%}
.dc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;line-height:1.5}
.bs{align-items:flex-end;margin-bottom:4px}
.bw{width:62px;text-align:center;font-size:.82rem}
.tr{position:relative;height:150px;background:#e4e8f1;border-radius:6px;margin-bottom:4px}
.fl{position:absolute;left:0;right:0;bottom:0;border-radius:6px}
.nm{position:absolute;left:0;right:0;font-weight:700}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tp table{width:100%;border-collapse:collapse;font-size:.8rem}
.tp th{background:#eaf5f0;color:var(--g)}.tp th,.tp td{border:1px solid #d9dfe3;padding:3px 6px;text-align:center}
.sig{display:flex;justify-content:space-around;margin-top:22px;font-size:.85rem}
.by{text-align:center;color:#8a9aa0;font-size:.72rem;margin-top:12px}
@media print{
@page{size:A4;margin:10mm}
body{background:#fff}header.top,.panel.form,#err,.lgph{display:none}
.wrap{display:block;padding:0}.panel{border:0;padding:0}.panel h2{display:none}
.scroll{overflow:visible}#paper{border:0;min-width:0;max-width:none;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top"><h1>تحليل نتائج مادة لصف واحد</h1><p>إعداد وتصميم: أ. ماجد الحربي</p></header>
<div class="wrap">
<section class="panel form">
<h2>بيانات التقرير</h2>
<div class="row"><div><label>الإدارة العامة للتعليم</label><input id="edu" value="الإدارة العامة للتعليم بالمنطقة"></div><div><label>المدرسة</label><input id="school" value="مدرسة"></div></div>
<label>عنوان التقرير</label><input id="title" value="تحليل نتائج اختبار مادة [الرياضيات]">
<div class="row"><div><label>نوع الاختبار</label><input id="exam" value="الاختبار النهائي"></div><div><label>المرحلة / الصف</label><input id="grade" value="ثاني متوسط / ٢"></div></div>
<div class="row"><div><label>السنة / الفصل الدراسي</label><input id="term" value="الفصل الأول / ١٤٤٧هـ"></div><div><label>درجة القياس (الاختبار)</label><input id="max" type="number" min="1" value="40"></div></div>
<label>أسماء الطلاب (اختياري، اسم في كل سطر)</label><textarea id="names"></textarea>
<label>درجات الطلاب (افصل بينها بمسافة أو سطر أو فاصلة)</label>
<textarea id="scores">40 40 40 40 40 39 39 35 35 34 32 32 31 29 29 20 20 19 15 5</textarea>
<div class="row"><div><label>التوقيع الأيمن</label><input id="s1" value="معلم المادة / ماجد الحربي"></div><div><label>التوقيع الأيسر</label><input id="s2" value="مدير المدرسة / الاسم"></div></div>
<label>شعار مخصص (اختياري)</label><input id="logo" type="file" accept="image/*">
<label class="chk"><input type="checkbox" id="ar" checked> استخدام الأرقام العربية (١٢٣)</label>
<div id="err" role="alert"></div>
<div class="btns"><button class="alt" id="go">معاينة</button><button id="pdf">تحميل PDF</button><button class="alt" id="png">تحميل صورة</button><button class="alt" id="reset">استعادة القيم الافتراضية</button></div>
</section>
<section class="panel"><h2>المعاينة</h2><div class="scroll"><div id="paper"></div></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const defaults={};document.querySelectorAll('input[id],textarea').forEach(e=>{if(e.type!=='file'&&e.type!=='checkbox')defaults[e.id]=e.value});
let logoData='',useAr=true;
const A2E=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=s=>useAr?String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(s);
const r2=v=>Math.round(v*100)/100;
const N=v=>T(r2(v));
const P=v=>N(v)+(useAr?'٪':'%');
const COL=['#66b97a','#5aaeac','#5b9be0','#e08c46','#e5706b'],NM=['ممتاز','جيد جداً','جيد','مقبول','ضعيف'],TH=[.9,.8,.7,.5,0];
$('logo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{logoData=r.result;render()};r.readAsDataURL(f)};
function render(){
  const err=$('err');err.textContent='';err.style.color='';useAr=$('ar').checked;
  const max=parseFloat(A2E($('max').value));
  const sc=A2E($('scores').value).split(/[\s,;]+/).filter(Boolean).map(Number);
  if(!(max>0)){err.textContent='أدخل درجة قياس صحيحة.';return}
  if(!sc.length||sc.some(x=>isNaN(x))){err.textContent='تأكد أن الدرجات أرقام فقط.';return}
  if(sc.some(x=>x<0||x>max)){err.textContent='توجد درجة خارج الحد المسموح (0 إلى '+max+').';return}
  const names=$('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(names.length&&names.length!==sc.length){err.textContent='عدد الأسماء ('+names.length+') لا يطابق عدد الدرجات ('+sc.length+').';return}
  const n=sc.length,sum=sc.reduce((a,b)=>a+b,0),mean=sum/n;
  const lo=TH.map(p=>r2(max*p));
  const rows=NM.map((l,i)=>{const c=sc.filter(x=>x>=lo[i]&&(i?x<lo[i-1]:true)).length;return{l,i,c,p:c/n*100,rg:N(i?r2(lo[i-1]-.01):max)+' - '+N(lo[i])}});
  const mx=Math.max(...rows.map(r=>r.c),1),C=2*Math.PI*38;
  const stats=[['عدد الطلاب',N(n)],['أعلى درجة',N(Math.max(...sc))],['أقل درجة',N(Math.min(...sc))],['متوسط الدرجات',N(mean)],['نسبة التحصيل',P(mean/max*100)],['مجموع الدرجات',N(sum)]];
  const dn=r=>`<div class="dnt"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e4e8f1" stroke-width="9"/>${r.c?`<circle cx="50" cy="50" r="38" fill="none" stroke="${COL[r.i]}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*r.p/100} ${C}" transform="rotate(-90 50 50)"/>`:''}</svg><div class="dc">${r.l}<br>${P(r.p)}</div></div>`;
  const bar=r=>{const h=Math.round(r.c/mx*124);return `<div class="bw"><div class="tr"><div class="fl" style="height:${h}px;background:${COL[r.i]}"></div><div class="nm" style="bottom:${h+3}px">${N(r.c)}</div></div>${r.l}</div>`};
  const list=(a,t)=>`<table><tr><th colspan="3">${t}</th></tr>${a.map((x,i)=>`<tr><td>${N(i+1)}</td><td>${esc(x.n)}</td><td>${N(x.s)}</td></tr>`).join('')}</table>`;
  let tops='';
  if(names.length){const ps=names.map((x,i)=>({n:x,s:sc[i]})).sort((a,b)=>b.s-a.s);tops=`<div class="tp">${list(ps.slice(0,5),'أعلى الطلاب')}${list(ps.slice(-5).reverse(),'الطلاب المحتاجون للدعم')}</div>`}
  $('paper').innerHTML=`
  <div class="hd"><div>${esc($('edu').value)}<br>${esc($('school').value)}</div>
  <div>${logoData?`<img src="${logoData}" alt="">`:'<div class="lgph">مكان الشعار</div>'}</div>
  <div><div class="ex">${esc($('exam').value)}</div></div></div>
  <div class="tw"><div class="ttl">${esc($('title').value)}</div></div>
  <div class="fbs"><div class="fb"><span>المرحلة الدراسية / الصف:</span>${T(esc($('grade').value))}</div>
  <div class="fb"><span>السنة / الفصل الدراسي:</span>${T(esc($('term').value))}</div>
  <div class="fb"><span>درجة القياس (الاختبار):</span>${N(max)}</div></div>
  <div class="cols"><div>${stats.map(s=>`<div class="r"><div class="lb">${s[0]}</div><div class="vl">${s[1]}</div></div>`).join('')}</div>
  <div><div class="dh">الإحصائيات التفصيلية</div>
  <div class="dr h"><div>المستوى</div><div>النطاق</div><div>عدد الطلاب</div></div>
  ${rows.map(r=>`<div class="dr"><div class="pl" style="background:${COL[r.i]}">${r.l}</div><div class="vl">${r.rg}</div><div class="vl">${N(r.c)}</div></div>`).join('')}</div></div>
  <div class="cb"><div class="ct">رسم بياني (نسب الطلاب لكل تقدير)</div><div class="dns">${rows.map(dn).join('')}</div>
  <div class="ct" style="margin-top:14px">رسم بياني (عدد الطلاب لكل تقدير)</div><div class="bs">${rows.map(bar).join('')}</div></div>
  ${tops}
  <div class="sig"><div>${esc($('s1').value)}</div><div>${esc($('s2').value)}</div></div>
  <div class="by">تصميم وإعداد: أ. ماجد الحربي</div>`;
}
let dlp;const getDl=()=>dlp||(dlp=(window.claude&&claude.use)?claude.use('downloads'):Promise.resolve(null));
const msg=(t,ok)=>{const e=$('err');e.textContent=t;e.style.color=ok?'#2f8f5b':''};
async function snap(){
  render();if($('err').textContent)return null;
  await document.fonts.ready;
  return html2canvas($('paper'),{scale:2,backgroundColor:'#fff',useCORS:true,windowWidth:900,onclone:d=>{
    d.querySelector('header.top').style.display='none';d.querySelector('.panel.form').style.display='none';
    const w=d.querySelector('.wrap');w.style.display='block';w.style.padding='0';
    d.querySelectorAll('.panel').forEach(x=>{x.style.border='0';x.style.padding='0'});
    d.querySelectorAll('.panel h2').forEach(x=>x.style.display='none');
    d.querySelector('.scroll').style.overflow='visible';
    const p=d.getElementById('paper');p.style.width='794px';p.style.maxWidth='none';p.style.minWidth='0';p.style.border='0';p.style.borderRadius='0';
  }});
}
async function save(kind){
  const dl=await getDl();
  if(!dl){msg('التحميل غير متاح في هذا العرض، افتح الرابط في المتصفح أو تطبيق Claude.');return}
  if(!window.html2canvas||!window.jspdf){msg('تعذر تحميل أدوات التصدير، تأكد من الاتصال بالإنترنت وأعد المحاولة.');return}
  msg('جاري تجهيز الملف...',true);
  try{
    const cv=await snap();if(!cv)return;
    let data;
    if(kind==='png')data=await new Promise(r=>cv.toBlob(r,'image/png'));
    else{const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let w=210,h=cv.height*w/cv.width;if(h>297){w=w*297/h;h=297}
      pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(210-w)/2,0,w,h);data=pdf.output('blob')}
    await dl.save({filename:'results-analysis.'+kind,data});
    msg('تم تجهيز الملف.',true);
  }catch(e){msg(e&&e.code==='declined'?'تم إلغاء التحميل.':'تعذر التحميل'+(e&&e.code?' ('+e.code+')':'')+'، أعد المحاولة.')}
}
$('go').onclick=render;$('ar').onchange=render;$('pdf').onclick=()=>save('pdf');$('png').onclick=()=>save('png');
$('reset').onclick=()=>{for(const k in defaults)$(k).value=defaults[k];$('names').value='';logoData='';$('logo').value='';$('ar').checked=true;render()};
render();
</script>
</body>
</html>
